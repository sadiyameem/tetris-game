<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tetris Game</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <canvas id="game"></canvas>
        <div id="container">
            <div id="instructions">
                <h2>How to Play</h2>
                <p>To move blocks use ← →</p>
                <p>To move down blocks use ↓</p>
                <p>To rotate the blocks use ↑</p>
                <p>To restart game use ↻</p>
                <p>When playing this game make sure to resize your screen</p>

                <div class="card">
                    <button class="play">Play Game</button>
                    <button class="pause">Pause Game</button>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
